version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
      POSTGRES_DB: outbox
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  # Full app stack (opt-in): docker compose --profile app up -d --build
  api:
    build: ./backend
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://outbox:outbox@postgres:5432/outbox
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      API_PUBLIC_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:8080
      GOOGLE_REDIRECT_URI: http://localhost:4000/api/auth/google/callback
      SLACK_REDIRECT_URI: http://localhost:4000/api/slack/callback
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  worker:
    build: ./backend
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://outbox:outbox@postgres:5432/outbox
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      API_PUBLIC_URL: http://localhost:4000
    command: ["node", "dist/worker.js"]
    depends_on:
      - api

  web:
    build: ./frontend
    profiles: ["app"]
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  redis-data:
  pg-data:
  es-data:
